<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MULTI_PROTOCOL_PLC_HMI系統架構圖</title>
  <desc id="desc">設備與協定來源經通訊管理層轉換為PointValue，透過ValueBus提供給Tkinter HMI與DatabaseManager。</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop offset="0" stop-color="#0757c7"/><stop offset="1" stop-color="#073f98"/></linearGradient>
    <linearGradient id="softBlue" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient>
    <linearGradient id="softGreen" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f7fff8"/><stop offset="1" stop-color="#e9f7e8"/></linearGradient>
    <linearGradient id="softGold" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fffdf3"/><stop offset="1" stop-color="#fff4c9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17365d" flood-opacity="0.18"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0757c7"/></marker>
    <style>
      .t{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;fill:#111827}
      .title{font-size:48px;font-weight:800;fill:#0a2f74}
      .head{font-size:26px;font-weight:700;fill:#fff}
      .box{font-size:21px;font-weight:600}
      .small{font-size:18px;font-weight:600}
      .note{font-size:22px}
      .panel{fill:#fff;stroke:#2f6fc9;stroke-width:2;filter:url(#shadow)}
      .node{stroke-width:1.8;filter:url(#shadow)}
      .flow{fill:none;stroke:#0757c7;stroke-width:5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>
  <path d="M0 0H120L55 90H0Z" fill="#0757c7"/><path d="M78 0H145L82 75H42Z" fill="#7cb2f5" opacity=".75"/>
  <text x="90" y="75" class="t title">MULTI_PROTOCOL_PLC_HMI系統架構圖</text>
  <line x1="85" y1="105" x2="1530" y2="105" stroke="#0757c7" stroke-width="3"/><circle cx="1530" cy="105" r="6" fill="#0757c7"/>

  <!-- config -->
  <rect x="390" y="132" width="260" height="70" rx="12" fill="#fff" stroke="#7b8794" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M426 149h25l13 13v27h-38z" fill="none" stroke="#4b5563" stroke-width="3"/><path d="M451 149v14h13" fill="none" stroke="#4b5563" stroke-width="3"/>
  <text x="535" y="177" class="t box" text-anchor="middle">config.json</text>
  <path d="M520 202V242" class="flow"/>

  <!-- source panel -->
  <rect x="35" y="250" width="285" height="480" rx="14" class="panel"/>
  <path d="M35 264a14 14 0 0 1 14-14h257a14 14 0 0 1 14 14v55H35Z" fill="url(#header)"/>
  <text x="178" y="294" class="t head" text-anchor="middle">設備 / 協定來源</text>
  <g class="t box" text-anchor="middle">
    <rect x="58" y="350" width="240" height="92" rx="12" fill="url(#softBlue)" stroke="#2f6fc9" class="node"/><text x="178" y="405">Modbus RTU PLC</text>
    <rect x="58" y="478" width="240" height="92" rx="12" fill="url(#softBlue)" stroke="#2f6fc9" class="node"/><text x="178" y="533">Modbus TCP PLC</text>
    <rect x="58" y="606" width="240" height="92" rx="12" fill="url(#softBlue)" stroke="#2f6fc9" class="node"/><text x="178" y="646"><tspan x="178">OPC UA</tspan><tspan x="178" dy="27">Server / PLC</tspan></text>
  </g>

  <!-- manager panel -->
  <rect x="380" y="250" width="310" height="480" rx="14" class="panel"/>
  <path d="M380 264a14 14 0 0 1 14-14h282a14 14 0 0 1 14 14v55H380Z" fill="url(#header)"/>
  <text x="535" y="294" class="t head" text-anchor="middle">通訊管理層</text>
  <g class="t small" text-anchor="middle">
    <rect x="405" y="350" width="260" height="72" rx="12" fill="url(#softGreen)" stroke="#5b9b57" class="node"/><text x="535" y="393">ModbusRtuManager</text>
    <rect x="405" y="442" width="260" height="72" rx="12" fill="url(#softGreen)" stroke="#5b9b57" class="node"/><text x="535" y="485">ModbusTcpManager</text>
    <rect x="405" y="534" width="260" height="72" rx="12" fill="url(#softGreen)" stroke="#5b9b57" class="node"/><text x="535" y="577">OpcuaMultiServerManager</text>
    <rect x="405" y="626" width="260" height="72" rx="12" fill="url(#softGreen)" stroke="#5b9b57" class="node"/><text x="535" y="669">ConfigManager</text>
  </g>

  <!-- unified panel -->
  <rect x="750" y="250" width="230" height="480" rx="14" class="panel"/>
  <path d="M750 264a14 14 0 0 1 14-14h202a14 14 0 0 1 14 14v55H750Z" fill="url(#header)"/>
  <text x="865" y="294" class="t head" text-anchor="middle">統一資料層</text>
  <g class="t box" text-anchor="middle">
    <rect x="775" y="400" width="180" height="82" rx="12" fill="url(#softGold)" stroke="#d89a00" class="node"/><text x="865" y="449">PointValue</text>
    <rect x="775" y="540" width="180" height="82" rx="12" fill="url(#softGold)" stroke="#d89a00" class="node"/><text x="865" y="589">ValueBus</text>
  </g>

  <!-- app panel -->
  <rect x="1040" y="250" width="300" height="480" rx="14" class="panel"/>
  <path d="M1040 264a14 14 0 0 1 14-14h272a14 14 0 0 1 14 14v55h-300Z" fill="url(#header)"/>
  <text x="1190" y="294" class="t head" text-anchor="middle">應用層</text>
  <g class="t box" text-anchor="middle">
    <rect x="1070" y="365" width="240" height="92" rx="12" fill="url(#softBlue)" stroke="#2f6fc9" class="node"/><text x="1190" y="420">Tkinter HMI</text>
    <rect x="1070" y="505" width="240" height="82" rx="12" fill="url(#softBlue)" stroke="#2f6fc9" class="node"/><text x="1190" y="554">DatabaseManager</text>
    <rect x="1070" y="630" width="240" height="72" rx="12" fill="#f4efff" stroke="#7353ad" class="node"/><text x="1190" y="674">MySQL</text>
  </g>
  <path d="M1190 457V492" class="flow"/><path d="M1190 587V617" class="flow"/>

  <!-- pages -->
  <g class="t small" text-anchor="middle">
    <rect x="1390" y="275" width="180" height="54" rx="10" fill="url(#softBlue)" stroke="#2f6fc9" class="node"/><text x="1480" y="309">總覽頁</text>
    <rect x="1390" y="342" width="180" height="54" rx="10" fill="url(#softBlue)" stroke="#2f6fc9" class="node"/><text x="1480" y="376">統一監控頁</text>
    <rect x="1390" y="409" width="180" height="54" rx="10" fill="url(#softBlue)" stroke="#2f6fc9" class="node"/><text x="1480" y="443">Modbus RTU設定</text>
    <rect x="1390" y="476" width="180" height="54" rx="10" fill="url(#softBlue)" stroke="#2f6fc9" class="node"/><text x="1480" y="510">Modbus TCP設定</text>
    <rect x="1390" y="543" width="180" height="54" rx="10" fill="url(#softBlue)" stroke="#2f6fc9" class="node"/><text x="1480" y="577">OPC UA設定</text>
    <rect x="1390" y="610" width="180" height="54" rx="10" fill="url(#softBlue)" stroke="#2f6fc9" class="node"/><text x="1480" y="644">OPC UA瀏覽</text>
    <rect x="1390" y="677" width="180" height="54" rx="10" fill="url(#softBlue)" stroke="#2f6fc9" class="node"/><text x="1480" y="711">Database設定</text>
  </g>

  <!-- flows -->
  <path d="M320 525H365" class="flow"/><path d="M690 525H735" class="flow"/><path d="M980 525H1025" class="flow"/>
  <path d="M1310 411H1360V302H1376" fill="none" stroke="#0757c7" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1360 369H1376M1360 436H1376M1360 503H1376M1360 570H1376M1360 637H1376M1360 704H1376" fill="none" stroke="#0757c7" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1310 385C1328 385 1340 390 1360 411" fill="none" stroke="#0757c7" stroke-width="3"/>

  <!-- write back -->
  <path d="M1180 350V222H670" fill="none" stroke="#0757c7" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="925" y="210" class="t small" text-anchor="middle" fill="#0757c7">寫入控制（writable=true）</text>

  <!-- note -->
  <rect x="120" y="785" width="1360" height="82" rx="16" fill="url(#softBlue)" stroke="#6b9fe2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="190" cy="826" r="27" fill="#0757c7"/><text x="190" y="836" class="t" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">i</text>
  <text x="800" y="835" class="t note" text-anchor="middle">不同協定資料會先轉成 <tspan fill="#0757c7" font-weight="700">PointValue</tspan>，再透過 <tspan fill="#0757c7" font-weight="700">ValueBus</tspan> 提供給 <tspan fill="#0757c7" font-weight="700">HMI</tspan> 與 <tspan fill="#0757c7" font-weight="700">Database</tspan>。</text>
</svg>